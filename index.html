<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0A0B0D"><link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Maison"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<script>tailwind.config={theme:{extend:{colors:{o9:'#0A0B0D',o7:'#181A20',o6:'#232630',g:'#D4AF37',g2:'#E5C158',iv:'#F8F5EE',mu:'#8E93A0'}}}}</script>
<style>
:root{--bg:#0E0F12;--fg:#F8F5EE;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:'Plus Jakarta Sans',system-ui,sans-serif}
.br{font-family:'Cormorant Garamond',Georgia,serif;font-variant-numeric:lining-nums}.wm{font-family:Cinzel,Georgia,serif}
.card{background:#181A20;border:1px solid rgba(212,175,55,.25);border-radius:1rem;padding:1rem;margin-top:.75rem}
.inp{width:100%;background:#0A0B0D;border:1px solid rgba(212,175,55,.35);border-radius:.6rem;padding:.6rem .75rem;font-size:.85rem;outline:none;color:#F8F5EE}
.btn{background:#D4AF37;color:#0A0B0D;font-weight:700;border-radius:.75rem;padding:.55rem 1rem;font-size:.8rem}
.btn2{background:rgba(212,175,55,.1);color:#D4AF37;border:1px solid rgba(212,175,55,.3);border-radius:.75rem;padding:.5rem .9rem;font-size:.75rem;font-weight:600}
.chip{font-size:.62rem;font-weight:700;padding:.1rem .5rem;border-radius:99px;border:1px solid;white-space:nowrap}
.ok{color:#34d399;border-color:#34d39955}.lo{color:#fbbf24;border-color:#fbbf2455}.no{color:#f87171;border-color:#f8717155}.gd{color:#D4AF37;border-color:#D4AF3755}
</style></head>
<body>
<div id="login" class="fixed inset-0 z-50 bg-o9 flex items-center justify-center p-6">
 <form onsubmit="return enter(event)" class="w-full max-w-sm text-center">
  <img src="maison-logo-final.png" alt="Maison" class="w-24 h-24 mx-auto rounded-full border border-g">
  <h2 class="wm text-2xl text-g tracking-widest mt-4">MAISON</h2><p class="text-[10px] text-mu tracking-[.3em] uppercase">Exclusive Designs</p>
  <input class="inp mt-6" type="email" value="diana@maison.com"><input class="inp mt-3" type="password" value="maison2026">
  <button class="btn w-full mt-4 py-3">Entrar</button><p class="text-[10px] text-mu mt-4">Acceso de demostración</p>
 </form>
</div>
<div id="app" class="hidden max-w-3xl mx-auto pb-32">
 <div class="bg-g/10 border-b border-g/30 text-[11px] text-g2 px-4 py-1.5 flex justify-between"><span>DEMO · datos de ejemplo, nada es real</span><button onclick="resetDemo()" class="underline">Restablecer</button></div>
 <header class="px-4 py-3 flex items-center justify-between">
  <div class="flex items-center gap-2"><img src="maison-logo-final.png" alt="Maison" class="w-9 h-9 rounded-full border border-g"><span class="wm text-g font-bold tracking-wider">MAISON</span></div>
  <div class="text-right text-[11px] leading-tight"><div id="ck" class="text-g font-semibold"></div><div id="dt" class="text-mu"></div></div>
 </header>
 <h1 id="ttl" class="br text-3xl text-g px-4 mb-1"></h1>
 <main id="view" class="px-4"></main>
</div>
<button id="fab" onclick="openM('venta')" class="hidden btn fixed right-4 shadow-lg z-30" style="bottom:calc(76px + env(safe-area-inset-bottom,0px))">+ Nueva acción</button>
<nav id="nav" class="hidden fixed bottom-0 inset-x-0 z-30 bg-o9 border-t border-g/25 overflow-x-auto whitespace-nowrap" style="padding-bottom:env(safe-area-inset-bottom,0px)"></nav>
<div id="modal" class="hidden fixed inset-0 z-40 bg-black/80 flex items-center justify-center p-4"><div class="bg-o7 border border-g rounded-2xl w-full max-w-md p-5 max-h-[90vh] overflow-y-auto"><div id="mb"></div></div></div>
<div id="toast" class="hidden fixed left-1/2 -translate-x-1/2 z-50 bg-o7 border border-g text-g text-xs font-semibold px-4 py-2.5 rounded-xl max-w-[90vw] text-center" style="bottom:calc(130px + env(safe-area-inset-bottom,0px))"></div>
<script>
const CANVA='https://maisonbycocinasmg.my.canva.site/web-maison-by-cc-mg',KEY='maison_demo_v2',TZ='America/Bogota';
const CITY={'Cali':[0,80000],'Jamundí':[50000,120000],'Yumbo':[50000,120000],'Palmira':[50000,120000],'Candelaria':[50000,120000]};
const T=[['inicio','🏠','Inicio','Hola Diana, ¿en qué te ayudo?'],['cat','📦','Catálogo','Catálogo y stock'],['ven','💰','Ventas','Ventas'],['rem','🧾','Remisiones','Remisiones de entrega'],['cot','🧮','Cotizador','Cotizador'],['rep','📊','Reportes','Reportes de ventas'],['plan','👑','Planes','Planes y precios'],['set','⚙️','Ajustes','Ajustes']];
const PL=[['Taller',119000,'1 punto de venta o taller artesanal',['1 usuario','Registro rápido de ventas por texto','Hasta 150 referencias activas']],['Mueblería Pro',199000,'Mayor rotación · recomendado',['Hasta 3 usuarios (administrador y operarios)','Inventario ilimitado','Remisiones digitalizadas por foto (simulado)','Alertas de agotados dentro de la app']],['Multisede',359000,'Varias salas de exhibición o bodegas',['Usuarios ilimitados','Gestión multi-inventario','Reportes consolidados de ventas estimadas']]];
let S,tab='inicio',q='',bill='m',rep={},foto=false,lastQ=null;
const $=i=>document.getElementById(i),money=n=>'$'+Math.round(n).toLocaleString('es-CO'),norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fD=i=>new Date(i).toLocaleDateString('es-CO',{timeZone:TZ,day:'numeric',month:'short'}),fT=i=>new Date(i).toLocaleString('es-CO',{timeZone:TZ,day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const dd=(n,h)=>{const x=new Date();x.setDate(x.getDate()-n);x.setHours(h||10,0,0,0);return x.toISOString()};
function seed(){return{prod:[[1,'Tocador Hollywood','RH',1850000,4],[2,'Tocador Clásico','ECO',1250000,7],[3,'Tocador Minimalista','ECO',980000,2],[4,'Cocina Integral 3 m','RH',7800000,1],[5,'Cocina Isla','ECO',5600000,3],[6,'Cama Doble con Cabecero','ECO',1450000,5],[7,'Cama King','RH',2100000,0],[8,'Puff Capitoné','ECO',380000,8]].map(a=>({id:a[0],name:a[1],line:a[2],price:a[3],stock:a[4]})),
sales:[[6,'Marcela Ríos',2,1,1250000],[5,'Juan Pablo Cruz',6,1,1450000],[4,'Daniela Soto',1,1,1850000],[3,'Natalia Pérez',8,2,760000],[1,'Camilo Vargas',5,1,5600000],[0,'Laura Gómez',3,1,980000]].map((a,i)=>({id:i+1,date:dd(a[0]),cliente:a[1],pid:a[2],qty:a[3],total:a[4]})),
rem:[[2,'Daniela Soto',1,'Cali',1850000,'Entregada'],[1,'Camilo Vargas',5,'Jamundí',5600000,'Pendiente'],[0,'Laura Gómez',3,'Cali',980000,'Pendiente']].map((a,i)=>({id:i+1,date:dd(a[0]),cliente:a[1],pid:a[2],ciudad:a[3],valor:a[4],estado:a[5],foto:i==1})),
cot:[{id:1,date:dd(1),cliente:'Andrea Torres',detalle:'Cocina Isla ECO · Yumbo',total:5770000},{id:2,date:dd(2),cliente:'Carlos Mejía',detalle:'Cama King RH · Cali',total:2180000}],
log:[{t:dd(0,9),x:'Venta registrada: Tocador Minimalista ECO a Laura Gómez'},{t:dd(1,12),x:'Cotización guardada: Andrea Torres'},{t:dd(1,11),x:'Nueva remisión: Camilo Vargas · Jamundí'}]}}
function ld(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.prod)return o}}catch(e){}return seed()}
function sv(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const pb=id=>S.prod.find(p=>p.id==id),pn=p=>p.name+' '+p.line,nid=a=>a.reduce((m,x)=>Math.max(m,x.id),0)+1;
const lg=x=>{S.log.unshift({t:new Date().toISOString(),x});S.log=S.log.slice(0,30)};
const chip=p=>p.stock==0?'<span class="chip no">Agotado</span>':p.stock<=2?`<span class="chip lo">Poco stock · ${p.stock}</span>`:`<span class="chip ok">Disponible · ${p.stock}</span>`;
const row=(a,b)=>`<div class="flex justify-between items-center gap-3 py-2 border-b border-o6 last:border-0 text-xs"><span class="text-mu">${a}</span><span class="text-right">${b}</span></div>`;
const card=(h,b)=>`<div class="card">${h?`<h3 class="br text-lg text-g font-bold mb-1">${h}</h3>`:''}${b}</div>`;
const kpi=(a,b)=>`<div class="card !mt-0"><div class="text-[11px] text-mu">${a}</div><div class="br text-g text-lg font-bold mt-1">${b}</div></div>`;
const fld=(l,i)=>`<label class="block text-[11px] text-iv/80 mt-3 mb-1">${l}</label>${i}`;
const popt=(id,f)=>`<select id="${id}" class="inp" ${f||''}>${S.prod.map(p=>`<option value="${p.id}">${esc(pn(p))} — ${money(p.price)}${p.stock?'':' (agotado)'}</option>`).join('')}</select>`;
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add('hidden'),3200)}
function tick(){const n=new Date(),d=n.toLocaleDateString('es-CO',{timeZone:TZ,weekday:'long',day:'numeric',month:'long'});$('ck').textContent=n.toLocaleTimeString('es-CO',{timeZone:TZ});$('dt').textContent=d.charAt(0).toUpperCase()+d.slice(1)}
function enter(e){e.preventDefault();$('login').classList.add('hidden');['app','nav','fab'].forEach(i=>$(i).classList.remove('hidden'));S=ld();tick();setInterval(tick,1000);render();return false}
function go(t){tab=t;render()}
function render(){const t=T.find(x=>x[0]==tab);$('ttl').textContent=t[3];$('view').innerHTML=V[tab]();$('nav').innerHTML=T.map(x=>`<button onclick="go('${x[0]}')" class="inline-block px-4 py-2 text-[11px] ${x[0]==tab?'text-g font-bold':'text-mu'}"><div class="text-lg">${x[1]}</div>${x[2]}</button>`).join('');if(tab=='cot')calc();window.scrollTo(0,0)}
function resetDemo(){S=seed();rep={};sv();toast('Demo restablecida');render()}
const V={
inicio(){const w=Date.now()-6048e5,s7=S.sales.filter(s=>new Date(s.date)>w).reduce((a,s)=>a+s.total,0),low=S.prod.filter(p=>p.stock<=2);
return `<div class="grid grid-cols-2 gap-3 mt-3">${kpi('Ventas (7 días)',money(s7))}${kpi('Remisiones pendientes',S.rem.filter(r=>r.estado=='Pendiente').length)}${kpi('Cotizaciones guardadas',S.cot.length)}${kpi('Alertas de stock',low.length)}</div>`+
card('Alertas de inventario',low.length?low.map(p=>row(esc(pn(p)),chip(p))).join(''):'<p class="text-xs text-mu">Todo en orden.</p>')+
card('Actividad reciente',S.log.slice(0,5).map(l=>row(esc(l.x),`<span class="text-[10px] text-mu">${fT(l.t)}</span>`)).join(''))+
`<a href="${CANVA}" target="_blank" rel="noopener" class="btn2 inline-block mt-4">Abrir catálogo Canva</a>`},
cat(){return `<input class="inp mt-3" placeholder="Buscar producto…" value="${esc(q)}" oninput="q=this.value;$('cl').innerHTML=catL()"><div id="cl" class="grid sm:grid-cols-2 gap-3 mt-3">${catL()}</div><a href="${CANVA}" target="_blank" rel="noopener" class="btn2 inline-block mt-4">Abrir catálogo Canva</a><p class="text-[10px] text-mu mt-3">Productos y precios de ejemplo; se reemplazan por el catálogo real.</p>`},
ven(){return card('Registro rápido',`<input id="rt" class="inp" placeholder="Ej: Vendí un tocador Hollywood a Laura por 1850000"><button class="btn w-full mt-2" onclick="regT()">Registrar venta</button><p class="text-[10px] text-mu mt-2">Escribe la venta en una frase y se descuenta del stock.</p>`)+card('Historial de ventas',S.sales.slice().reverse().map(s=>{const p=pb(s.pid);return row(`<b class="text-iv">${esc(s.cliente)}</b><br>${esc(p?pn(p):'')} × ${s.qty} · ${fD(s.date)}`,`<b class="br text-g">${money(s.total)}</b>`)}).join(''))},
rem(){return `<div class="flex justify-between items-center mt-3"><span class="text-xs text-mu">${S.rem.length} remisiones</span><button class="btn" onclick="openM('rem')">📷 Nueva remisión</button></div>`+S.rem.slice().reverse().map(r=>{const p=pb(r.pid);return card('',`<div class="flex justify-between gap-2"><div><b class="text-sm">${esc(r.cliente)}</b><p class="text-[11px] text-mu">${esc(p?pn(p):'')} · ${esc(r.ciudad)} · ${fD(r.date)}</p></div><span class="chip ${r.estado=='Entregada'?'ok':'lo'}">${r.estado}</span></div>${r.foto?'<div class="mt-2 h-16 rounded-lg border border-g/40 bg-o9 flex items-center justify-center text-[11px] text-g">📄 Foto de remisión adjunta (simulada)</div>':''}<div class="flex justify-between items-center mt-3"><b class="br text-g">${money(r.valor)}</b>${r.estado=='Pendiente'?`<button class="btn2" onclick="entr(${r.id})">Marcar entregada</button>`:''}</div>`)}).join('')},
cot(){return card('',`${fld('Cliente','<input id="qcl" class="inp" placeholder="Nombre del cliente">')}${fld('Producto',popt('qp','onchange="calc()"'))}<div class="grid grid-cols-2 gap-3">${fld('Cantidad','<input id="qn" type="number" min="1" value="1" class="inp" oninput="calc()">')}${fld('Ciudad',`<select id="qc" class="inp" onchange="calc()">${Object.keys(CITY).map(c=>`<option>${c}</option>`).join('')}</select>`)}</div><label class="flex items-center gap-2 text-xs mt-3"><input id="qi" type="checkbox" onchange="calc()" class="accent-yellow-500"> Incluir instalador</label>`)+
card('Resumen','<div id="qo"></div><div class="flex gap-2 mt-3"><button class="btn" onclick="saveQ()">Guardar cotización</button><button class="btn2" onclick="copyQ()">Copiar resumen</button></div><p class="text-[10px] text-mu mt-3">Fletes e instalación de ejemplo. Se ajustan al tarifario real.</p>')+
card('Cotizaciones guardadas',S.cot.slice().reverse().map(c=>row(`<b class="text-iv">${esc(c.cliente)}</b><br>${esc(c.detalle)} · ${fD(c.date)}`,`<b class="br text-g">${money(c.total)}</b>`)).join(''))},
rep(){const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const k=d.toLocaleDateString('es-CO',{timeZone:TZ});return{k,l:d.toLocaleDateString('es-CO',{timeZone:TZ,weekday:'short'}),v:S.sales.filter(s=>new Date(s.date).toLocaleDateString('es-CO',{timeZone:TZ})==k).reduce((a,s)=>a+s.total,0)}}),mx=Math.max(1,...days.map(d=>d.v)),tot=days.reduce((a,d)=>a+d.v,0),by={};
S.sales.forEach(s=>{by[s.pid]=(by[s.pid]||0)+s.qty});const top=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,3);
return `<div class="grid grid-cols-2 gap-3 mt-3">${kpi('Ventas (7 días)',money(tot))}${kpi('Ventas registradas',S.sales.length)}</div>`+card('Ventas por día',`<div class="flex items-end gap-2 h-32">${days.map(d=>`<div class="flex-1 flex flex-col items-center justify-end h-full"><div class="w-full rounded-t bg-g" style="height:${Math.round(d.v/mx*100)}%;min-height:2px"></div><span class="text-[10px] text-mu mt-1">${d.l}</span></div>`).join('')}</div>`)+card('Más vendidos',top.map(t=>row(esc(pn(pb(t[0]))),t[1]+' uds')).join(''))+card('Inventario',row('Referencias',S.prod.length)+row('Agotadas',S.prod.filter(p=>!p.stock).length)+row('Poco stock',S.prod.filter(p=>p.stock>0&&p.stock<=2).length))},
plan(){const a=bill=='a';return `<div class="card !border-amber-400/50 text-xs leading-relaxed text-amber-100"><b>Primera versión de demostración.</b> La foto de remisión y los varios usuarios se muestran simulados; el servicio completo los incluirá. Los 7 días de prueba comienzan cuando haya al menos una función real funcionando con tus datos. Precios de lanzamiento en pesos colombianos (COP), sujetos a ajuste. No incluye facturación electrónica.</div>
<div class="flex gap-2 mt-3"><button class="${a?'btn2':'btn'}" onclick="bill='m';render()">Mensual</button><button class="${a?'btn':'btn2'}" onclick="bill='a';render()">Anual · 2 meses de regalo</button></div>`+PL.map((p,i)=>card('',`<div class="flex justify-between items-start"><div><b class="br text-g text-lg">${p[0]}</b><p class="text-[11px] text-mu">${p[2]}</p></div>${i==1?'<span class="chip gd">Recomendado</span>':''}</div><div class="br text-2xl mt-2">${money(a?p[1]*10:p[1])}<span class="text-xs text-mu">${a?' /año':' /mes'}</span></div>${a?`<p class="text-[10px] text-mu">Equivale a ${money(p[1]*10/12)} al mes</p>`:''}<ul class="mt-3 space-y-1 text-xs">${p[3].map(f=>`<li>✓ ${f}</li>`).join('')}</ul>`)).join('')+`<p class="text-[10px] text-mu mt-3">7 días de prueba sin tarjeta, una vez haya funciones reales con tus datos.</p>`},
set(){return card('Negocio',row('Nombre','Muebles Maison')+row('Sede','Cali')+row('Versión','Demo v2 (simulada)'))+card('Datos de la demo',`<p class="text-xs text-mu">Las acciones cambian los datos solo en este dispositivo. Restablece antes de grabar.</p><button class="btn mt-3" onclick="resetDemo()">Restablecer demo</button>`)+`<button class="btn2 mt-4" onclick="location.reload()">Cerrar sesión</button>`}};
function catL(){const n=norm(q),l=S.prod.filter(p=>norm(pn(p)).includes(n));return l.length?l.map(p=>card('',`<div class="flex justify-between gap-2"><div><b class="text-sm">${esc(p.name)}</b><br><span class="chip gd">${p.line}${p.line=='RH'?' · resistente a la humedad':' · económica'}</span></div>${chip(p)}</div><div class="flex justify-between items-center mt-3"><b class="br text-g">${money(p.price)}</b><div class="flex items-center gap-2"><button class="btn2" onclick="adj(${p.id},-1)">−</button><span class="text-xs w-5 text-center">${p.stock}</span><button class="btn2" onclick="adj(${p.id},1)">+</button></div></div>`)).join(''):'<p class="text-xs text-mu">Sin resultados.</p>'}
function adj(id,d){const p=pb(id);p.stock=Math.max(0,p.stock+d);if(!p.stock){lg('Alerta: '+pn(p)+' se agotó');toast('Alerta automática: '+pn(p)+' agotado')}sv();$('cl').innerHTML=catL()}
function regT(){const t=$('rt').value.trim();if(!t)return toast('Escribe qué vendiste');const n=norm(t);let b=null,bs=0;S.prod.forEach(p=>{const s=norm(pn(p)).split(/\s+/).filter(x=>x.length>3&&n.includes(x)).length;if(s>bs){bs=s;b=p}});if(!b)return toast('No encontré el producto. Prueba: Vendí un tocador Hollywood a Laura por 1850000');const m=t.match(/(\d{1,3}(?:[.\s]\d{3})+|\d{5,})/),c=t.match(/\ba\s+([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+)/);sale(b.id,c?c[1]:'Cliente',1,m?parseInt(m[1].replace(/[.\s]/g,''),10):b.price)}
function sale(pid,c,qty,total){const p=pb(pid);if(p.stock<qty){toast('Sin stock suficiente: '+pn(p));return false}p.stock-=qty;S.sales.push({id:nid(S.sales),date:new Date().toISOString(),cliente:c||'Cliente',pid:p.id,qty,total});lg('Venta registrada: '+pn(p)+' a '+(c||'Cliente'));if(!p.stock){lg('Alerta: '+pn(p)+' se agotó');toast('Alerta automática: '+pn(p)+' agotado')}else toast('Venta registrada · '+money(total));sv();render();return true}
function entr(id){const r=S.rem.find(x=>x.id==id);r.estado='Entregada';lg('Remisión entregada: '+r.cliente);sv();toast('Remisión marcada como entregada');render()}
function calc(){const p=pb($('qp').value),n=Math.max(1,+$('qn').value||1),c=$('qc').value,f=CITY[c][0],s=$('qi').checked?CITY[c][1]:0,t=p.price*n+f+s;lastQ={cliente:$('qcl').value.trim()||'Cliente',detalle:n+' × '+pn(p)+' · '+c,total:t};$('qo').innerHTML=row('Subtotal',money(p.price*n))+row('Flete',f?money(f):'Sin costo')+row('Instalación',s?money(s):'—')+row('Total','<b class="br text-g">'+money(t)+'</b>')}
function copyQ(){const t='Cotización Muebles Maison\nCliente: '+lastQ.cliente+'\n'+lastQ.detalle+'\nTotal: '+money(lastQ.total);try{navigator.clipboard.writeText(t).then(()=>toast('Resumen copiado'),()=>toast('No se pudo copiar'))}catch(e){toast('No se pudo copiar')}}
function saveQ(){S.cot.push({id:nid(S.cot),date:new Date().toISOString(),...lastQ});lg('Cotización guardada: '+lastQ.cliente);sv();toast('Cotización guardada');render()}
function openM(k){$('modal').classList.remove('hidden');const o=[['venta','Venta de tocador o mueble'],['rem','Adjuntar foto de remisión'],['cot','Generar cotización rápida'],['inv','Entrada de inventario'],['canva','Ver catálogo Canva']];let f='';foto=false;
if(k=='venta')f=fld('Cliente','<input id="mc" class="inp" placeholder="Nombre del cliente">')+fld('Producto',popt('mp'))+fld('Cantidad','<input id="mq" type="number" min="1" value="1" class="inp">')+'<button class="btn w-full mt-4" onclick="mSale()">Registrar venta</button>';
if(k=='rem')f=fld('Cliente','<input id="mc" class="inp" placeholder="Nombre del cliente">')+fld('Producto',popt('mp'))+fld('Ciudad',`<select id="mci" class="inp">${Object.keys(CITY).map(c=>`<option>${c}</option>`).join('')}</select>`)+'<button class="btn2 w-full mt-3" onclick="foto=true;this.outerHTML=\'<div class=&quot;mt-3 h-20 rounded-lg border border-g/40 bg-o9 flex items-center justify-center text-xs text-g&quot;>📄 Foto adjunta (simulada)</div>\'">📷 Tomar foto (simulado)</button><button class="btn w-full mt-4" onclick="mRem()">Guardar remisión</button>';
if(k=='cot')f='<p class="text-xs text-mu mt-3">Te llevo al cotizador para armar la cotización.</p><button class="btn w-full mt-4" onclick="closeM();go(\'cot\')">Abrir cotizador</button>';
if(k=='inv')f=fld('Producto',popt('mp'))+fld('Unidades que entran','<input id="mq" type="number" min="1" value="1" class="inp">')+'<button class="btn w-full mt-4" onclick="mInv()">Registrar entrada</button>';
if(k=='canva')f=`<a href="${CANVA}" target="_blank" rel="noopener" class="btn block text-center mt-4" onclick="closeM()">Abrir catálogo Canva</a>`;
$('mb').innerHTML=`<div class="flex justify-between items-center"><h3 class="br text-g font-bold">Nueva acción</h3><button onclick="closeM()" class="text-mu text-xl">✕</button></div><label class="block text-[11px] text-iv/80 mt-3 mb-1">Acción</label><select class="inp" onchange="openM(this.value)">${o.map(x=>`<option value="${x[0]}" ${x[0]==k?'selected':''}>${x[1]}</option>`).join('')}</select>${f}`}
function closeM(){$('modal').classList.add('hidden')}
function mSale(){const p=pb($('mp').value),n=Math.max(1,+$('mq').value||1);if(sale(p.id,$('mc').value.trim(),n,p.price*n))closeM()}
function mRem(){const p=pb($('mp').value),c=$('mc').value.trim()||'Cliente';S.rem.push({id:nid(S.rem),date:new Date().toISOString(),cliente:c,pid:p.id,ciudad:$('mci').value,valor:p.price,estado:'Pendiente',foto});lg('Nueva remisión: '+c+' · '+$('mci').value);sv();closeM();toast('Remisión guardada'+(foto?' con foto':''));go('rem')}
function mInv(){const p=pb($('mp').value),n=Math.max(1,+$('mq').value||1);p.stock+=n;lg('Entrada de inventario: '+n+' × '+pn(p));sv();closeM();toast('Inventario actualizado');render()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
